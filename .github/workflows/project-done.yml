name: Move Implementation to Done
# Done is implementation completion only. Never write release/deployment fields.
on:
  pull_request:
    branches: [main]
    types: [closed]
  issues:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  move-to-done:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issues' && github.event.issue.state_reason == 'completed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await require('./.github/scripts/delivery-state.cjs')
              .moveImplementationDone({github, context, core, projectNumber:4});
