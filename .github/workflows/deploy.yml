name: Tự động Deploy lên VPS từ PROD

on:
  push:
    branches: [ prod ]
  # Cho phép chạy tay khi cần re-deploy mà không cần push commit mới.
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Read-only checks as the deploy SSH user; do not deploy'
        type: boolean
        default: false

# Hai deploy chồng nhau sẽ đánh nhau trên cùng một working tree.
# rebuild-finance-prod.sh đã có lock file, nhưng fail sớm ở đây thì log dễ đọc hơn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Privileged diagnostics always use reviewed main, never a task-branch script.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Prepare fixed read-only diagnostic
        env:
          REGISTERED_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          configured = os.environ.get('REGISTERED_PROJECT_DIR', '')
          if configured and configured != '/home/evg-user/FinanceAssistant':
              raise SystemExit('Registered project differs; do not probe an unregistered target')
          data = Path('ops/fleet/deploy_preflight.py').read_bytes()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('FLEET_DIAG_B64=' + base64.b64encode(data).decode() + '\n')
              output.write('FLEET_DIAG_SHA=' + hashlib.sha256(data).hexdigest() + '\n')
          PY
      - name: Read-only preflight through existing deploy SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FLEET_DIAG_B64,FLEET_DIAG_SHA,PROD_PROJECT_DIR
          command_timeout: 3m
          script: |
            set -euo pipefail
            if [ "${PROD_PROJECT_DIR:-$HOME/FinanceAssistant}" != '/home/evg-user/FinanceAssistant' ]; then
              echo 'Registered deploy target differs; diagnostic stopped without application changes.'
              exit 2
            fi
            umask 077
            FLEET_DIAG_FILE="$(mktemp /tmp/fleet-finance-preflight.XXXXXX.py)"
            trap 'rm -f "$FLEET_DIAG_FILE"' EXIT
            printf '%s' "$FLEET_DIAG_B64" | base64 --decode > "$FLEET_DIAG_FILE"
            printf '%s  %s\n' "$FLEET_DIAG_SHA" "$FLEET_DIAG_FILE" | sha256sum -c -
            python3 "$FLEET_DIAG_FILE"
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only
    runs-on: ubuntu-latest
    steps:
      # Không cần actions/checkout: toàn bộ deploy chạy trên VPS bằng bản clone
      # của chính nó. Runner chỉ đóng vai trò mở SSH.
      - name: Deploy lên VPS qua SSH
        uses: appleboy/ssh-action@v1.0.3 # Dùng version cụ thể cho ổn định
        env:
          # Optional repo variable — để trống thì dùng $HOME/FinanceAssistant.
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROD_PROJECT_DIR
          # Build image (multi-stage: admin SPA + backend) + migration + healthcheck
          # lâu hơn default 10m của action rất nhiều.
          command_timeout: 30m
          script: |
            # Fail fast — appleboy/ssh-action đã bỏ script_stop nên cần set -e thủ công.
            set -eo pipefail

            PROJECT_DIR="${PROD_PROJECT_DIR:-$HOME/FinanceAssistant}"
            DEPLOY_SCRIPT="$PROJECT_DIR/scripts/rebuild-finance-prod.sh"

            # ── Pre-flight ────────────────────────────────────────────────
            # Ba guard dưới đây chỉ để biến lỗi hạ tầng thành thông báo đọc
            # được. Nếu không có chúng, deploy chết với "exit status 128"
            # trần trụi và phải mò log mới biết vì sao.
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "::error::Không tìm thấy PROJECT_DIR: $PROJECT_DIR"
              echo "Set repo variable PROD_PROJECT_DIR trỏ đúng thư mục clone trên VPS."
              exit 1
            fi
            cd "$PROJECT_DIR"

            if ! git rev-parse --git-dir >/dev/null 2>&1; then
              echo "::error::$PROJECT_DIR không đọc được như một git repo bởi user $(whoami)."
              echo "Thường gặp: repo thuộc user khác nên .git/config bị Permission denied."
              echo "Không đổi quyền hàng loạt: .git/config có thể chứa credential được bảo vệ."
              echo "PM/DevOps chạy diagnostics_only trên workflow main đã review để đối chiếu đúng user và phương án sửa hẹp."
              exit 1
            fi

            if [ ! -f "$DEPLOY_SCRIPT" ]; then
              echo "::error::Không tìm thấy $DEPLOY_SCRIPT"
              echo "Bản clone trên VPS đang ở commit cũ hơn script — pull tay một lần rồi chạy lại."
              exit 1
            fi

            # ── Deploy ────────────────────────────────────────────────────
            # rebuild-finance-prod.sh là entry point deploy prod duy nhất. Nó tự lo:
            #   pre-flight (.env, deps, đúng branch prod, tree sạch) → git pull --ff-only
            #   → DB backup → docker compose down → build + up --wait (compose file
            #   deploy/production/, gồm backend + scheduler; admin SPA build TRONG image)
            #   → smoke test /health → rollback nếu fail → image prune → Telegram notify.
            #
            # KHÔNG thêm `docker compose` hay `deploy_admin.sh` vào đây nữa:
            #   - docker-compose.yml ở repo root chỉ có postgres + redis. Chạy
            #     `up --remove-orphans` với nó dưới cùng project name `financeassistant`
            #     sẽ xoá luôn container finance-backend và finance-scheduler.
            #   - deploy_admin.sh thuộc kiến trúc systemctl + caddy cũ (build SPA bằng
            #     npm trên host, restart betien-api). Kiến trúc hiện tại chạy Docker.
            #
            # Lưu ý: script tự pull code, nên lần deploy này chạy bản script ĐANG có
            # trên VPS; thay đổi trong chính script chỉ có hiệu lực từ deploy kế tiếp.
            export PROJECT_DIR
            bash "$DEPLOY_SCRIPT"
