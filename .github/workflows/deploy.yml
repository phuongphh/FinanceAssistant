name: Tự động Deploy lên VPS từ PROD

on:
  push:
    branches: [ prod ]
  # Cho phép chạy tay khi cần re-deploy mà không cần push commit mới.
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Read-only checks as the deploy SSH user; do not deploy'
        type: boolean
        default: false
      approved_sha:
        description: 'Exact approved prod commit (required for manual deployment)'
        type: string
      expected_checkout_sha:
        description: 'Freshly inspected Production checkout SHA (required for manual deployment)'
        type: string

# Hai deploy chồng nhau sẽ đánh nhau trên cùng một working tree.
# rebuild-finance-prod.sh đã có lock file, nhưng fail sớm ở đây thì log dễ đọc hơn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Privileged diagnostics always use reviewed main, never a task-branch script.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Prepare fixed read-only diagnostic
        env:
          REGISTERED_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          configured = os.environ.get('REGISTERED_PROJECT_DIR', '')
          if configured and configured != '/home/evg-user/FinanceAssistant':
              raise SystemExit('Registered project differs; do not probe an unregistered target')
          data = Path('ops/fleet/deploy_preflight.py').read_bytes()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('FLEET_DIAG_B64=' + base64.b64encode(data).decode() + '\n')
              output.write('FLEET_DIAG_SHA=' + hashlib.sha256(data).hexdigest() + '\n')
          PY
      - name: Read-only preflight through existing deploy SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FLEET_DIAG_B64,FLEET_DIAG_SHA,PROD_PROJECT_DIR
          command_timeout: 3m
          script: |
            set -euo pipefail
            if [ "${PROD_PROJECT_DIR:-$HOME/FinanceAssistant}" != '/home/evg-user/FinanceAssistant' ]; then
              echo 'Registered deploy target differs; diagnostic stopped without application changes.'
              exit 2
            fi
            umask 077
            FLEET_DIAG_FILE="$(mktemp /tmp/fleet-finance-preflight.XXXXXX.py)"
            trap 'rm -f "$FLEET_DIAG_FILE"' EXIT
            printf '%s' "$FLEET_DIAG_B64" | base64 --decode > "$FLEET_DIAG_FILE"
            printf '%s  %s\n' "$FLEET_DIAG_SHA" "$FLEET_DIAG_FILE" | sha256sum -c -
            python3 -I "$FLEET_DIAG_FILE"
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      # Deployment controller is reviewed main, separate from the release payload.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Prepare reviewed controller and exact release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
          INPUT_SHA: ${{ inputs.approved_sha }}
          INPUT_BASELINE: ${{ inputs.expected_checkout_sha }}
          REGISTERED_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, re
          from pathlib import Path
          env = os.environ
          if env.get('REGISTERED_PROJECT_DIR', '') not in ('', '/home/evg-user/FinanceAssistant'):
              raise SystemExit('Unregistered project target')
          event, ref = env['EVENT_NAME'], env['EVENT_REF']
          if event == 'push' and ref == 'refs/heads/prod':
              candidate, baseline = env['EVENT_SHA'], env['PREVIOUS_SHA']
          elif event == 'workflow_dispatch' and ref == 'refs/heads/main':
              candidate, baseline = env.get('INPUT_SHA', ''), env.get('INPUT_BASELINE', '')
          else:
              raise SystemExit('Deploy only from prod push or reviewed main manual dispatch')
          if not all(re.fullmatch('[0-9a-f]{40}', value) and value != '0' * 40 for value in (candidate, baseline)):
              raise SystemExit('Exact approved and observed baseline SHAs are required')
          payload = Path('scripts/rebuild-finance-prod.sh').read_bytes()
          with open(env['GITHUB_ENV'], 'a') as out:
              out.write('FLEET_DEPLOY_B64=' + base64.b64encode(payload).decode() + '\n')
              out.write('FLEET_DEPLOY_SHA=' + hashlib.sha256(payload).hexdigest() + '\n')
              out.write('FLEET_RELEASE_SHA=' + candidate + '\n')
              out.write('FLEET_BASELINE_SHA=' + baseline + '\n')
          PY
      - name: Deploy pinned release through existing SSH and sudo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FLEET_DEPLOY_B64,FLEET_DEPLOY_SHA,FLEET_RELEASE_SHA,FLEET_BASELINE_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            umask 077
            FLEET_STAGE="$(mktemp -d /tmp/fleet-finance-deploy.XXXXXXXX)"
            trap 'rm -f "$FLEET_STAGE/deploy.sh"; rmdir "$FLEET_STAGE"' EXIT
            printf '%s' "$FLEET_DEPLOY_B64" | base64 --decode > "$FLEET_STAGE/deploy.sh"
            printf '%s  %s\n' "$FLEET_DEPLOY_SHA" "$FLEET_STAGE/deploy.sh" | sha256sum -c -
            # No sudoers changes or new credential. Existing sudo must permit this.
            sudo -n /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/root \
              PROJECT_DIR=/home/evg-user/FinanceAssistant BRANCH=prod \
              APPROVED_SHA="$FLEET_RELEASE_SHA" EXPECTED_CHECKOUT_SHA="$FLEET_BASELINE_SHA" \
              SKIP_PRUNE=1 /bin/bash "$FLEET_STAGE/deploy.sh"
