name: Delivery Contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/delivery/requirements.txt
      - run: python -m unittest discover -s tests/delivery_contract -p 'test_*.py'
      - run: node --test tests/delivery_contract/*.test.cjs
