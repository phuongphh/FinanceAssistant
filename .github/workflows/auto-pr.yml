name: Auto Create PR
on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'
      - '!claude/merge-prod-release-**'
      # Local task PRs are owned by the shared fleet controller.
      - '!claude/local-issue-*'
      - '!codex/local-issue-*'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      # Privileged publisher executes trusted main, never code from a task branch.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require('node:fs');
            const file = './.github/scripts/auto-pr.cjs';
            if (!fs.existsSync(file)) {
              core.notice('Publisher not installed on main yet; bootstrap PR must be opened by operator.');
              return;
            }
            await require(file).ensurePullRequest({github, context, core});
