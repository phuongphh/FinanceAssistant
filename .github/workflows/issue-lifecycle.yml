name: Issue Lifecycle Sync

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  # Nightly safety net (02:17 giờ VN) — catches events that were missed,
  # e.g. issues closed while the workflow was broken or its run was dropped.
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# One shared group: runs never race each other on docs/issues/. GitHub keeps
# only one pending run per group (a newer one replaces it), which is safe
# because every run reconciles ALL issues from the API, not just its own.
concurrency:
  group: issue-lifecycle
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Reconcile docs/issues with GitHub, commit and push
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "${GH_TOKEN}" ]; then
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          fi

          if [ -n "${ISSUE_NUMBER}" ]; then
            msg="docs(issues): sync after #${ISSUE_NUMBER} (${ACTION})"
          else
            msg="docs(issues): reconcile (${EVENT_NAME})"
          fi

          # Each attempt resets to the latest origin/main, re-runs the
          # idempotent reconcile script (fetches every issue from the API,
          # moves/writes files, regenerates indexes + README stats), then
          # tries to push. Retrying from a fresh main avoids merge conflicts.
          attempt_sync() {
            # Best-effort fetch: in some contexts token is unavailable.
            git fetch origin main --depth=1 2>/dev/null || true
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              git reset --hard origin/main || return 1
            else
              git reset --hard HEAD || return 1
            fi

            node .github/scripts/issue-lifecycle.js || return 1

            git add -A docs/issues/
            if git diff --cached --quiet; then
              echo "No changes to commit — docs/issues already up to date"
              return 0
            fi

            git commit -m "${msg}" || return 1
            git push origin main
          }

          for i in 1 2 3 4 5 6; do
            if attempt_sync; then
              exit 0
            fi
            sleep_secs=$((2 ** i))
            echo "Sync attempt $i failed; retrying in ${sleep_secs}s..."
            sleep $sleep_secs
          done

          echo "Sync failed after 6 attempts"
          exit 1
