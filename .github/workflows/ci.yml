# CI chạy full pytest trên mọi PR. Tên "CI" được agent-events.yml + agent-loop.yml
# (ci_workflows) dùng để phát hiện CI fail trên PR agent → tự sửa.

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # vnstock đôi khi cài lỗi trên runner → fallback bỏ qua (test đã mock).
          pip install -r backend/requirements.txt \
            || (grep -v '^vnstock' backend/requirements.txt > "$RUNNER_TEMP/req.txt" \
                && pip install -r "$RUNNER_TEMP/req.txt")
          pip install pytest pytest-asyncio pyyaml

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
