# Phase 4B Epic 4 — Zalo channel copy (Vietnamese only).
#
# Persona: Bé Tiền — ấm áp, gần gũi, không phán xét.
# Channel rules (Zalo):
#   - Plain text, KHÔNG dùng Markdown (Zalo OA không hỗ trợ).
#   - Tối đa ~300 ký tự / tin nhắn (giới hạn hiển thị Zalo).
#   - Tối đa 2 emoji / tin nhắn.

linking:
  # Telegram: hướng dẫn ban đầu sau khi user gõ /link_zalo
  prompt: |-
    🔗 Để nhận thông báo qua Zalo:

    1️⃣ Mở Zalo → tìm "Bé Tiền" → bấm Quan tâm
    2️⃣ Nhắn mã sau cho Bé Tiền trên Zalo:

    `{token}`

    Mã có hiệu lực 10 phút và chỉ dùng được 1 lần.

  # Telegram: xác nhận sau khi link thành công
  confirm_telegram: |-
    ✅ Đã liên kết Zalo thành công!
    Từ giờ Bé Tiền sẽ gửi cảnh báo cashflow qua cả 2 kênh.

  # Zalo: chào người dùng lần đầu sau khi link xong
  confirm_zalo: |-
    ✅ Xin chào! Bé Tiền đã kết nối thành công.
    Bạn sẽ nhận thông báo cashflow tại đây.

  # Zalo: trả lời khi token sai/đã dùng/hết hạn
  token_invalid: |-
    ❌ Mã không hợp lệ hoặc đã hết hạn.
    Vào Telegram gõ /link_zalo để lấy mã mới nhé.

  token_already_used: |-
    ❌ Mã này đã được dùng rồi.
    Vào Telegram gõ /link_zalo để lấy mã mới nhé.

  token_expired: |-
    ❌ Mã đã hết hạn (mã chỉ dùng được trong 10 phút).
    Vào Telegram gõ /link_zalo để lấy mã mới nhé.

  # Telegram: khi user đã link rồi mà chạy lại /link_zalo
  already_linked: |-
    ℹ️ Bạn đã liên kết Zalo rồi.
    Dùng /unlink_zalo nếu muốn hủy liên kết.

  # Telegram: phản hồi cho /unlink_zalo
  unlinked: |-
    ✅ Đã hủy liên kết Zalo.
    Bé Tiền sẽ chỉ gửi thông báo qua Telegram.

  not_linked: |-
    ℹ️ Bạn chưa liên kết Zalo. Gõ /link_zalo để bắt đầu.

  # Telegram: khi cấu hình Zalo trên server chưa sẵn sàng
  not_configured: |-
    ⚠️ Tính năng Zalo chưa được bật trên hệ thống.
    Vui lòng thử lại sau nhé.

# Cashflow alert format dành riêng cho Zalo — ngắn gọn hơn Telegram.
# Tổng độ dài luôn ≤ 300 ký tự (notifier sẽ truncate nếu vượt).
cashflow_alert:
  body: |-
    ⚠️ {month}: số dư có thể xuống ~{balance} (dưới ngưỡng an toàn {threshold} bạn đặt).

    Gợi ý: {suggested_action}
  body_no_threshold: |-
    ⚠️ {month}: số dư có thể xuống ~{balance}.

    Gợi ý: {suggested_action}

# Profile snippet — added to /profile when Zalo linked.
profile_status:
  linked: "🔗 Zalo: đã liên kết"
  not_linked: "🔗 Zalo: chưa liên kết (dùng /link_zalo)"

# ---------------------------------------------------------------------------
# Phase 5.0 #4.1 — thin slice trên Zalo.
#
# Zalo là kênh reactive-first: user nhắn trước, Bé Tiền trả lời. Ba việc
# làm được ở 5.0: ghi thu chi, xem báo cáo ngắn, liên kết tài khoản.
# Mọi thứ khác → fallback (lịch sự, không phải lỗi).
#
# Ràng buộc chữ: KHÔNG Markdown, không dùng * _ ~ [ ] ( ), ≤ 300 ký tự,
# ≤ 2 emoji. Dấu phân cách dùng "·" hoặc "-".
# ---------------------------------------------------------------------------

# Thẻ xác nhận sau khi ghi một giao dịch. Bản Zalo của thẻ Telegram:
# giữ nguyên con số, bỏ thanh tiến độ và nút bấm.
capture:
  expense: "✅ Đã ghi {merchant} {amount} · {category}"
  money_in: "✅ Đã nhận {merchant} {amount} · {category}"
  date_line: "Ngày giao dịch: {date}"
  source_line: "Từ: {source}"
  batch_header: "✅ Đã ghi {count} khoản · tổng {total}"
  batch_item: "- {merchant} {amount}"
  batch_more: "- và {count} khoản nữa"
  edit_hint: "Muốn sửa hay xoá thì mở Bé Tiền trên Telegram nhé."

# Báo cáo nhanh khi user hỏi "tháng này tiêu bao nhiêu".
report_short:
  spending: "Tháng {month} bạn đã chi {spent}."
  spending_with_budget: "Tháng {month} bạn đã chi {spent} trên {budget}."
  net_worth: "Tổng tài sản của bạn đang là {net_worth}."
  empty: "Tháng này chưa có khoản chi nào được ghi. Nhắn cho Bé Tiền là xong nhé."

# Intent nằm ngoài thin slice. Là lời mời, không phải báo lỗi.
# Nested dưới "body" cho đồng bộ với cashflow_alert — loader chỉ đọc
# section → key, không đọc string ở cấp cao nhất.
fallback:
  body: |-
    Trên Zalo, Bé Tiền ghi thu chi và báo cáo nhanh thôi.
    Việc khác bạn mở Bé Tiền trên Telegram giúp mình nhé 🙏
  # Người chưa liên kết mà gõ linh tinh vẫn cần biết đường đi tiếp —
  # dùng lại linking.token_invalid, không thêm copy mới.

# Tài khoản bị admin tạm khoá (users.manual_status = suspended). Cùng
# một hàng rào như bên Telegram, nhưng copy ở đây chứ không hardcode
# trong code. Giọng Bé Tiền: nói rõ tình trạng, chỉ đường liên hệ,
# không trách móc và không giải thích lý do khoá (Bé Tiền không biết).
account:
  suspended: |-
    Tài khoản của bạn đang tạm khoá nên Bé Tiền chưa ghi nhận được.
    Bạn nhắn admin@nuitruc.ai để mở lại giúp mình nhé 🙏

# Zalo chỉ cho phép trả lời trong 48h sau tin nhắn cuối của user.
# Dùng khi user quay lại sau khi Bé Tiền phải nuốt một tin nhắn chủ động.
window_closed:
  body: |-
    Bé Tiền có vài điều muốn báo mà Zalo chỉ cho nhắn trong 48h nên chưa gửi kịp.
    Bạn nhắn "báo cáo" là mình kể ngay nhé.

# ---------------------------------------------------------------------------
# Phase 5.1 #3.2 — nút bấm.
#
# Zalo chỉ cho tối đa vài nút một tin. Nút nào không lên được thành nút
# thật thì tụt xuống thành một dòng gợi ý ở cuối tin — user vẫn làm được,
# chỉ là gõ thay vì bấm. Không nút nào biến mất im lặng.
#
# "{title}" là chữ trên nút, "{url}" là link. Giữ dòng thật ngắn: chúng
# nối vào cuối tin và vẫn phải lọt 300 ký tự.
# ---------------------------------------------------------------------------
buttons:
  query_line: '- Nhắn "{title}" nhé'
  url_line: "- {title}: {url}"

# ---------------------------------------------------------------------------
# Phase 5.1 #2.1 — copy cho các surface parity.
#
# Đây KHÔNG phải bản cắt của Telegram. Telegram có biểu đồ, nút bấm và
# chỗ để đọc dài; Zalo có một bong bóng 300 ký tự. Nên copy dưới đây
# viết ngắn từ đầu: mỗi dòng nói trọn một ý, renderer ghép các dòng lại
# theo thứ tự ưu tiên và bỏ bớt dòng cuối nếu tràn — không cắt giữa câu.
#
# Xưng hô: dùng "{salutation}" (anh/chị/bạn, lấy từ users.salutation qua
# onboarding_service.salutation_of) và "{Salutation}" khi đứng đầu câu.
# Không viết 3 bản copy riêng cho 3 xưng hô: cả ba đều là đại từ ngôi
# thứ hai nên thay thẳng vào chỗ trống là đúng ngữ pháp, và 3 bản rời
# sẽ lệch nhau ngay lần sửa chữ đầu tiên.
#
# Ràng buộc chữ (test tự động duyệt): ≤ 300 ký tự, ≤ 2 emoji, không ký
# tự Markdown và không dùng ngoặc đơn — Zalo hiển thị nguyên xi.
# ---------------------------------------------------------------------------

# Twin view. Con số đã format sẵn qua format_money_short trước khi vào đây.
twin:
  headline: "🔮 Tới {target_year}, tài sản của {salutation} có thể nằm quanh khoảng này:"
  range_line: "Khiêm tốn {p10} · Bình thường {p50} · Lạc quan {p90}"
  stale_note: "Số liệu hơi cũ rồi, {salutation} cập nhật tài sản để Bé Tiền vẽ lại nhé."
  note: "Đây là dự phóng xác suất từ số hiện có, không phải lời hứa."

# So sánh lộ trình hiện tại với lộ trình tối ưu.
twin_comparison:
  headline: "Nếu đổi cách phân bổ, tới {target_year} lộ trình của {salutation} có thể khác:"
  delta_line: "Hiện tại {current} · Tối ưu {optimal} · chênh {delta}"
  actions_lead: "Việc nên làm: {actions}"
  note: "Con số là dự phóng tham khảo, chọn thế nào vẫn là của {salutation} nhé."

# Mốc đạt được. Ăn mừng thật nhưng không tung hô, và tuyệt đối không so
# sánh với người khác hay nhắc lại chuyện chậm trễ trước đó.
milestone:
  headline: "🎉 {Salutation} vừa chạm mốc: {title}"
  twin_effect: "Twin đổi theo: {effect}"
  closing: "Bé Tiền ghi lại rồi, mình đi tiếp nhé."

# Tư vấn ngắn khi user hỏi "nên làm gì bây giờ".
advisory:
  lead: "Bé Tiền nhìn số của {salutation} thì thấy thế này:"
  point: "- {point}"
  suggestion: "Gợi ý: {suggestion}"
  disclaimer: "Đây là góc nhìn tham khảo, quyết định vẫn là của {salutation} nhé."

# Một quyết định cụ thể: mua, vay, đổi việc, rút tiền.
decision:
  lead: "{Salutation} hỏi về {topic}, Bé Tiền tính thử nhé:"
  impact: "Nếu làm, tới {target_year} tài sản có thể còn quanh {p50}, chênh {delta}."
  affordable: "Với dòng tiền hiện tại, khoản này nằm trong tầm của {salutation}."
  tight: "Khoản này hơi căng với dòng tiền hiện tại, {salutation} cân nhắc thêm nhé."
  disclaimer: "Bé Tiền đưa số, chọn vẫn là {salutation} nhé."

# Ghi hoặc sửa một tài sản từ Zalo.
asset_entry:
  saved: "✅ Đã ghi tài sản {name} {amount}"
  updated: "✅ Đã cập nhật {name} thành {amount}"
  net_worth_line: "Tổng tài sản giờ là {net_worth}."
  ask_amount: "{Salutation} cho Bé Tiền biết khoản này đang khoảng bao nhiêu nhé."
  edit_hint: "Muốn sửa thì nhắn lại tên tài sản kèm số mới là được."

# Onboarding cho người vào thẳng từ Zalo, chưa từng có Telegram. E4 #4.3
# nối dây; copy để sẵn ở đây để chỉ có một chỗ giữ chữ.
onboarding:
  welcome: "Chào {salutation} 👋 Bé Tiền là người đồng hành quản lý tài sản, nhắn gì Bé Tiền cũng ghi được."
  ask_name: "Bé Tiền gọi {salutation} là gì cho thân nhé?"
  ask_salutation: "Bé Tiền nên xưng hô thế nào ạ? Nhắn anh, chị hoặc bạn là được."
  ask_goal: "{Salutation} đang muốn tiền của mình phục vụ điều gì trước nhất?"
  ask_asset: "Giờ {salutation} cho Bé Tiền biết đang có khoảng bao nhiêu tài sản nhé."
  done: "Xong rồi ạ. Từ giờ {salutation} nhắn thu chi là Bé Tiền ghi ngay."
  # Lời mời sang Telegram chỉ gửi đúng một lần, không nhắc lại.
  telegram_invite: "Bé Tiền còn biểu đồ và báo cáo đầy đủ bên Telegram: {url}. Bé Tiền nhắn một lần thôi, không nhắc lại đâu ạ."
