# Phase 4B Epic 4 — Zalo channel copy (Vietnamese only).
#
# Persona: Bé Tiền — ấm áp, gần gũi, không phán xét.
# Channel rules (Zalo):
#   - Plain text, KHÔNG dùng Markdown (Zalo OA không hỗ trợ).
#   - Tối đa ~300 ký tự / tin nhắn (giới hạn hiển thị Zalo).
#   - Tối đa 2 emoji / tin nhắn.

linking:
  # Telegram: hướng dẫn ban đầu sau khi user gõ /link_zalo
  prompt: |-
    🔗 Để nhận thông báo qua Zalo:

    1️⃣ Mở Zalo → tìm "Bé Tiền" → bấm Quan tâm
    2️⃣ Nhắn mã sau cho Bé Tiền trên Zalo:

    `{token}`

    Mã có hiệu lực 10 phút và chỉ dùng được 1 lần.

  # Telegram: xác nhận sau khi link thành công
  confirm_telegram: |-
    ✅ Đã liên kết Zalo thành công!
    Từ giờ Bé Tiền sẽ gửi cảnh báo cashflow qua cả 2 kênh.

  # Zalo: chào người dùng lần đầu sau khi link xong
  confirm_zalo: |-
    ✅ Xin chào! Bé Tiền đã kết nối thành công.
    Bạn sẽ nhận thông báo cashflow tại đây.

  # Zalo: trả lời khi token sai/đã dùng/hết hạn
  token_invalid: |-
    ❌ Mã không hợp lệ hoặc đã hết hạn.
    Vào Telegram gõ /link_zalo để lấy mã mới nhé.

  token_already_used: |-
    ❌ Mã này đã được dùng rồi.
    Vào Telegram gõ /link_zalo để lấy mã mới nhé.

  token_expired: |-
    ❌ Mã đã hết hạn (mã chỉ dùng được trong 10 phút).
    Vào Telegram gõ /link_zalo để lấy mã mới nhé.

  # Telegram: khi user đã link rồi mà chạy lại /link_zalo
  already_linked: |-
    ℹ️ Bạn đã liên kết Zalo rồi.
    Dùng /unlink_zalo nếu muốn hủy liên kết.

  # Telegram: phản hồi cho /unlink_zalo
  unlinked: |-
    ✅ Đã hủy liên kết Zalo.
    Bé Tiền sẽ chỉ gửi thông báo qua Telegram.

  not_linked: |-
    ℹ️ Bạn chưa liên kết Zalo. Gõ /link_zalo để bắt đầu.

  # Telegram: khi cấu hình Zalo trên server chưa sẵn sàng
  not_configured: |-
    ⚠️ Tính năng Zalo chưa được bật trên hệ thống.
    Vui lòng thử lại sau nhé.

# Cashflow alert format dành riêng cho Zalo — ngắn gọn hơn Telegram.
# Tổng độ dài luôn ≤ 300 ký tự (notifier sẽ truncate nếu vượt).
cashflow_alert:
  body: |-
    ⚠️ {month}: số dư có thể xuống ~{balance} (dưới ngưỡng an toàn {threshold} bạn đặt).

    Gợi ý: {suggested_action}
  body_no_threshold: |-
    ⚠️ {month}: số dư có thể xuống ~{balance}.

    Gợi ý: {suggested_action}

# Profile snippet — added to /profile when Zalo linked.
profile_status:
  linked: "🔗 Zalo: đã liên kết"
  not_linked: "🔗 Zalo: chưa liên kết (dùng /link_zalo)"

# ---------------------------------------------------------------------------
# Phase 5.0 #4.1 — thin slice trên Zalo.
#
# Zalo là kênh reactive-first: user nhắn trước, Bé Tiền trả lời. Ba việc
# làm được ở 5.0: ghi thu chi, xem báo cáo ngắn, liên kết tài khoản.
# Mọi thứ khác → fallback (lịch sự, không phải lỗi).
#
# Ràng buộc chữ: KHÔNG Markdown, không dùng * _ ~ [ ] ( ), ≤ 300 ký tự,
# ≤ 2 emoji. Dấu phân cách dùng "·" hoặc "-".
# ---------------------------------------------------------------------------

# Thẻ xác nhận sau khi ghi một giao dịch. Bản Zalo của thẻ Telegram:
# giữ nguyên con số, bỏ thanh tiến độ và nút bấm.
capture:
  expense: "✅ Đã ghi {merchant} {amount} · {category}"
  money_in: "✅ Đã nhận {merchant} {amount} · {category}"
  date_line: "Ngày giao dịch: {date}"
  source_line: "Từ: {source}"
  batch_header: "✅ Đã ghi {count} khoản · tổng {total}"
  batch_item: "- {merchant} {amount}"
  batch_more: "- và {count} khoản nữa"
  edit_hint: "Muốn sửa hay xoá thì mở Bé Tiền trên Telegram nhé."

# Báo cáo nhanh khi user hỏi "tháng này tiêu bao nhiêu".
report_short:
  spending: "Tháng {month} bạn đã chi {spent}."
  spending_with_budget: "Tháng {month} bạn đã chi {spent} trên {budget}."
  net_worth: "Tổng tài sản của bạn đang là {net_worth}."
  empty: "Tháng này chưa có khoản chi nào được ghi. Nhắn cho Bé Tiền là xong nhé."

# Intent nằm ngoài thin slice. Là lời mời, không phải báo lỗi.
# Nested dưới "body" cho đồng bộ với cashflow_alert — loader chỉ đọc
# section → key, không đọc string ở cấp cao nhất.
fallback:
  body: |-
    Trên Zalo, Bé Tiền ghi thu chi và báo cáo nhanh thôi.
    Việc khác bạn mở Bé Tiền trên Telegram giúp mình nhé 🙏
  # Người chưa liên kết mà gõ linh tinh vẫn cần biết đường đi tiếp —
  # dùng lại linking.token_invalid, không thêm copy mới.

# Zalo chỉ cho phép trả lời trong 48h sau tin nhắn cuối của user.
# Dùng khi user quay lại sau khi Bé Tiền phải nuốt một tin nhắn chủ động.
window_closed:
  body: |-
    Bé Tiền có vài điều muốn báo mà Zalo chỉ cho nhắn trong 48h nên chưa gửi kịp.
    Bạn nhắn "báo cáo" là mình kể ngay nhé.
